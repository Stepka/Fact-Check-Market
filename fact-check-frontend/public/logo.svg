<svg width="300" height="64" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон с градиентом -->
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Круг -->
  <circle cx="32" cy="32" r="30" fill="url(#grad)" filter="url(#shadow)"/>

  <!-- Галочка -->
  <path d="M18 34 Q26 42 44 26" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Текст -->
  <text x="80" y="39" font-family="Arial, sans-serif" font-size="20" fill="#4F46E5" font-weight="bold">
    Fact-Checking Market
  </text>
</svg>


